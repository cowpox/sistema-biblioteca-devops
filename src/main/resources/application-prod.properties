# =============================================================
# Perfil de producao — ativado via SPRING_PROFILES_ACTIVE=prod
# Nao contem credenciais. Variaveis de banco sao injetadas pelo
# ambiente de hospedagem (Render) via DB_URL, DB_USER, DB_PASSWORD.
# =============================================================

# Silenciar SQL no log de producao
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ddl-auto=update: Hibernate cria o schema no primeiro deploy.
# Aceitavel para projeto academico. Em producao real, substituir
# por validate + ferramenta de migrations (Flyway ou Liquibase).
spring.jpa.hibernate.ddl-auto=update
