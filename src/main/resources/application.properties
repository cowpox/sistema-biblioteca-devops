spring.application.name=biblioteca

# ============================================================
# PostgreSQL - ambiente de desenvolvimento
# Configurar via variaveis de ambiente; os valores abaixo sao
# apenas fallback para maquina local. Nunca versionar senhas
# reais de producao.
# ============================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/biblioteca}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================================
# JPA / Hibernate
# ddl-auto=update: Hibernate cria/atualiza tabelas pelo modelo
# de entidades. Adequado para desenvolvimento academico.
# Em producao real, usar validate + Flyway.
# ============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
